<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5eead4"/>
    </marker>
    <marker id="ahr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="680" height="340" fill="#0f172a"/>
  <text x="340" y="34" text-anchor="middle" fill="#e6eaf0" font-size="17" font-weight="700">哈希冲突：开放寻址 + 线性探测</text>

  <rect x="290" y="56" width="100" height="44" rx="8" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="340" y="83" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="700">tl</text>
  <text x="340" y="112" text-anchor="middle" fill="#93a0b0" font-size="11">hash → 理想槽位 3</text>
  <path d="M340 100 L 293 146" fill="none" stroke="#5eead4" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="44" y="150" width="66" height="56" rx="6" fill="#16202e" stroke="#283040" stroke-width="1.5"/>
  <rect x="116" y="150" width="66" height="56" rx="6" fill="#16202e" stroke="#283040" stroke-width="1.5"/>
  <rect x="188" y="150" width="66" height="56" rx="6" fill="#16202e" stroke="#283040" stroke-width="1.5"/>
  <rect x="260" y="150" width="66" height="56" rx="6" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5"/>
  <rect x="332" y="150" width="66" height="56" rx="6" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5"/>
  <rect x="404" y="150" width="66" height="56" rx="6" fill="#1e293b" stroke="#5eead4" stroke-width="2"/>
  <rect x="476" y="150" width="66" height="56" rx="6" fill="#16202e" stroke="#283040" stroke-width="1.5"/>
  <rect x="548" y="150" width="66" height="56" rx="6" fill="#16202e" stroke="#283040" stroke-width="1.5"/>

  <text x="77" y="184" text-anchor="middle" fill="#93a0b0" font-size="13">.</text>
  <text x="149" y="184" text-anchor="middle" fill="#93a0b0" font-size="13">.</text>
  <text x="221" y="184" text-anchor="middle" fill="#93a0b0" font-size="13">.</text>
  <text x="293" y="184" text-anchor="middle" fill="#5eead4" font-size="13">tl2</text>
  <text x="365" y="184" text-anchor="middle" fill="#5eead4" font-size="13">tl3</text>
  <text x="437" y="184" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700">tl</text>
  <text x="509" y="184" text-anchor="middle" fill="#93a0b0" font-size="13">.</text>
  <text x="581" y="184" text-anchor="middle" fill="#93a0b0" font-size="13">.</text>

  <text x="77" y="226" text-anchor="middle" fill="#6c7889" font-size="12">0</text>
  <text x="149" y="226" text-anchor="middle" fill="#6c7889" font-size="12">1</text>
  <text x="221" y="226" text-anchor="middle" fill="#6c7889" font-size="12">2</text>
  <text x="293" y="226" text-anchor="middle" fill="#6c7889" font-size="12">3</text>
  <text x="365" y="226" text-anchor="middle" fill="#6c7889" font-size="12">4</text>
  <text x="437" y="226" text-anchor="middle" fill="#6c7889" font-size="12">5</text>
  <text x="509" y="226" text-anchor="middle" fill="#6c7889" font-size="12">6</text>
  <text x="581" y="226" text-anchor="middle" fill="#6c7889" font-size="12">7</text>

  <path d="M293 236 L 365 236" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#ahr)"/>
  <path d="M365 236 L 437 236" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#ahr)"/>
  <text x="365" y="258" text-anchor="middle" fill="#fbbf24" font-size="11">线性探测：3 被占 → 4 被占 → 落到 5</text>

  <text x="340" y="300" text-anchor="middle" fill="#93a0b0" font-size="11.5">理想下标 = threadLocalHashCode &amp; (len-1)；hash 用黄金分割魔数 0x61c88647，分布更均匀</text>
  <text x="340" y="320" text-anchor="middle" fill="#93a0b0" font-size="11.5">冲突不拉链表，往后逐个槽位找空位（开放寻址），所以 get/set 可能触发连续扫描</text>
</svg>
