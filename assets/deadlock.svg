<svg viewBox="0 0 680 460" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Java 死锁产生过程示意图</title>
  <desc>线程A持有lockA等待lockB，线程B持有lockB等待lockA，形成循环等待导致死锁</desc>
  <style>
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="32" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">死锁循环等待示意</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#888780">Thread-A 持有 lockA → 等待 lockB | Thread-B 持有 lockB → 等待 lockA</text>

  <g>
    <rect x="70" y="90" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="150" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Thread-A</text>
    <text x="150" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">持有 lockA，等待 lockB</text>
  </g>

  <g>
    <rect x="450" y="290" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="530" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Thread-B</text>
    <text x="530" y="330" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">持有 lockB，等待 lockA</text>
  </g>

  <g>
    <rect x="450" y="90" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="530" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">lockA</text>
    <text x="530" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">被 Thread-A 持有</text>
  </g>

  <g>
    <rect x="70" y="290" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="150" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">lockB</text>
    <text x="150" y="330" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">被 Thread-B 持有</text>
  </g>

  <path d="M230 118 Q 340 200 230 318" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="210" text-anchor="middle" font-size="12" fill="#185FA5">请求 lockB</text>

  <path d="M450 318 Q 340 200 450 118" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="260" text-anchor="middle" font-size="12" fill="#993C1D">请求 lockA</text>

  <path d="M230 130 L 450 130" fill="none" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="340" y="122" text-anchor="middle" font-size="11" fill="#854F0B">持有</text>

  <path d="M450 318 L 230 318" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="340" y="338" text-anchor="middle" font-size="11" fill="#0F6E56">持有</text>

  <text x="340" y="380" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">死锁四必要条件</text>
  <text x="340" y="400" text-anchor="middle" font-size="12" fill="#5F5E5A">①互斥  ②持有并等待  ③不可剥夺  ④循环等待</text>
  <text x="340" y="420" text-anchor="middle" font-size="12" fill="#888780">破坏任意一条即可避免死锁</text>
</svg>
